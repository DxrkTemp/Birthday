<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wifeyy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nunito:wght@400;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="floaties" id="floaties" aria-hidden="true"></div>

<div class="corner tr" aria-hidden="true">
  <span class="rose" data-c="red"></span>
  <span class="rose" data-c="pink"></span>
  <span class="rose" data-c="pink"></span>
</div>
<div class="corner bl" aria-hidden="true">
  <span class="rose" data-c="pink"></span>
  <span class="rose" data-c="red"></span>
  <span class="rose" data-c="red"></span>
</div>

<canvas id="fx" aria-hidden="true"></canvas>
<input type="file" id="photoInput" accept="image/*" hidden>

<div class="lock" id="lock" hidden>
  <div class="bear-slot" data-pose="happy"></div>
  <div class="lock-card">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="5" y="11" width="14" height="10" rx="2"/>
      <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
    </svg>
    <p class="lock-text" id="lockText"></p>
  </div>
</div>

<div class="app" id="app">
  <div class="topbar">
    <button class="back off" id="backBtn" aria-label="Go back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="progress" id="progress" aria-hidden="true"></div>
    <div class="spacer"></div>
  </div>

  <main class="scenes">
    <section class="scene active" data-scene="hello">
      <div class="bear-slot pop" data-pose="wave"></div>
      <h1 class="pop">Hi, <span class="hl nm"></span>!</h1>
      <p class="sub pop" id="askText">Myy, I made something special just for you. Do you want to see it?</p>
      <div class="row pop">
        <button class="btn primary" data-next>Yes!</button>
        <button class="btn" id="noBtn">No</button>
      </div>
    </section>

    <section class="scene" data-scene="gift" hidden>
      <h2 class="pop">This is for you</h2>
      <div class="gift-stage pop">
        <div class="bear-slot" data-pose="" id="giftBear"></div>
        <button class="gift" id="gift" aria-label="Open the gift">
          <span class="sparkle"></span>
          <span class="note" id="giftNote"></span>
          <span class="box"><span class="rose" data-c="red"></span></span>
          <span class="lid"><span class="bow"><i></i><i></i><b></b></span></span>
        </button>
      </div>
      <p class="say pop" id="giftHint">Tap your little gift to open it, Myy</p>
      <button class="btn primary next" id="giftNext" data-next hidden>
        Next <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </section>

    <section class="scene" data-scene="photos" hidden>
      <h2 class="pop">My Photos of You</h2>
      <div class="photo-stage pop">
        <div class="pstack s1"></div>
        <div class="pstack s2"></div>
        <div class="pcard" id="pcard"></div>
        <span class="rose" data-c="red"></span>
        <div class="bear-slot" data-pose="wave happy"></div>
      </div>
      <div class="pnav pop">
        <div class="group">
          <button class="round" id="pPrev" aria-label="Previous photo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
          <span class="count" id="pCount" aria-live="polite"></span>
          <button class="round" id="pNext" aria-label="Next photo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>
          </button>
        </div>
        <button class="btn primary next" data-next>
          Next <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>
    </section>

    <section class="scene" data-scene="letter" hidden>
      <h2 class="pop" id="mailTitle">You've got a love letter</h2>
      <button class="env pop" id="env" aria-label="Open the letter">
        <svg viewBox="0 0 260 200" aria-hidden="true">
          <rect class="s" x="10" y="60" width="240" height="132" rx="10" fill="#f4b896"/>
          <path class="flap-b s" d="M10 60 L130 132 L250 60 Z" fill="#f4b896"/>
          <g class="paper">
            <rect class="s" x="32" y="70" width="196" height="112" rx="8" fill="#ffffff"/>
            <path d="M54 96 H206 M54 116 H206 M54 136 H170" stroke="#e7c9b8" stroke-width="4" stroke-linecap="round"/>
          </g>
          <path class="s" d="M10 64 L130 138 L250 64 L250 182 Q250 192 240 192 L20 192 Q10 192 10 182 Z" fill="#ffcfb0"/>
          <g class="flap-f">
            <path class="s" d="M10 60 L130 132 L250 60 Z" fill="#ffdcc6"/>
            <path class="s" d="M130 128 c-10 -14 -28 -6 -22 8 c4 8 22 18 22 18 s18 -10 22 -18 c6 -14 -12 -22 -22 -8z" fill="#f6a6b8" stroke-width="3"/>
          </g>
        </svg>
      </button>
      <p class="say pop" id="envHint">Tap to open your letter</p>
      <article class="letter-card" id="letterCard" hidden>
        <span class="tape"></span>
        <div class="letter-scroll">
          <p class="dear" id="dearText"></p>
          <p class="body" id="letterBody"></p>
          <p class="sign" id="signText"></p>
        </div>
        <span class="rose" data-c="red"></span>
      </article>
      <button class="btn primary next" id="letterNext" data-next hidden>
        Next <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </section>

    <section class="scene" data-scene="cake" hidden>
      <h2 class="pop">Make a wish</h2>
      <p class="sub pop">Close your eyes, think of something good, then blow out the candles.</p>
      <div class="cake-stage pop">
        <div class="cake" id="cake">
          <div class="plate"></div>
          <div class="tier t1"></div>
          <div class="tier t2">
            <span class="rose" data-c="red"></span>
            <span class="rose" data-c="pink"></span>
            <span class="rose" data-c="red"></span>
          </div>
          <div class="candles">
            <div class="candle"><span class="flame"></span><span class="smoke"></span></div>
            <div class="candle"><span class="flame"></span><span class="smoke"></span></div>
            <div class="candle"><span class="flame"></span><span class="smoke"></span></div>
          </div>
        </div>
        <div class="bear-slot" data-pose="wow" id="cakeBear"></div>
      </div>
      <button class="btn primary pop" id="blowBtn">Blow the candles</button>
      <button class="btn primary next" id="cakeNext" data-next hidden>
        One more thing <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </section>

    <section class="scene" data-scene="finale" hidden>
      <div class="finale-bear pop">
        <div class="bear-slot" data-pose="bounce happy"></div>
        <div class="bouquet">
          <div class="stack">
            <span class="rose" data-c="red"></span>
            <span class="rose" data-c="pink"></span>
            <span class="rose" data-c="pink"></span>
          </div>
          <svg class="wrap-paper" viewBox="0 0 60 44" aria-hidden="true">
            <path d="M2 2 L30 42 L58 2 Q30 12 2 2z" fill="#ffffff" stroke="#6e4b3a" stroke-width="3" stroke-linejoin="round"/>
            <path d="M20 26 q10 6 20 0" fill="none" stroke="#e2556a" stroke-width="4" stroke-linecap="round"/>
          </svg>
        </div>
      </div>
      <h1 class="pop">Happy Birthday, <span class="hl nm"></span>!</h1>
      <p class="sub pop" id="finalText"></p>
      <p class="say pop" id="finalFrom"></p>
      <button class="btn pop" id="restartBtn">Watch it again</button>
    </section>
  </main>
</div>

<div class="wipe" id="wipe" aria-hidden="true">
  <svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.3 3 4.5 6.7 4.5c2.1 0 3.6 1.2 5.3 3.1 1.7-1.9 3.2-3.1 5.3-3.1 3.7 0 5.8 3.8 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>
</div>

<script src="script.js"></script>
</body>
</html>
